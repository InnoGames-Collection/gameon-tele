# ==============================================================================
# GameOn Tele — Complete Production Stack (Web + Admin + API + Postgres + Valkey)
# Target: GCP Compute Engine VM (innoserver-serv001: 34.41.116.217)
# Port Block:
#   - 3600: gameon-web (3D Helix Jump Tournament Client)
#   - 3602: gameon-api (Fastify Anti-Cheat API)
#   - 3603: gameon-admin (Tournament Operations Console)
#   - 5440: gameon-postgres (PostgreSQL 16)
#   - 6390: gameon-valkey (Valkey 8)
# ==============================================================================

services:
  # ── PostgreSQL 16 Enterprise Relational Store ────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gameon-tele-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gameon}
      POSTGRES_USER: ${POSTGRES_USER:-gameon_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gameon_secure_prod_password_2026}
    volumes:
      - gameon_tele_pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5440:5432"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gameon_app} -d ${POSTGRES_DB:-gameon}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Valkey 8.x Distributed High-Performance Cache ───────────────────────────
  valkey:
    image: valkey/valkey:8-alpine
    container_name: gameon-tele-valkey
    restart: unless-stopped
    command: ["valkey-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6390:6379"
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── GameOn Tele Fastify API ─────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gameon-tele-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3602
      HOST: 0.0.0.0
      DOMAIN: innopulseplatform.com
      DATABASE_URL: "postgresql://${POSTGRES_USER:-gameon_app}:${POSTGRES_PASSWORD:-gameon_secure_prod_password_2026}@postgres:5432/${POSTGRES_DB:-gameon}?sslmode=disable"
      VALKEY_URL: "redis://valkey:6379"
      JWT_SECRET: ${JWT_SECRET:-gameon-telecom-jwt-secret-key-prod-2026}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-gameon-admin-isolated-jwt-secret-prod-2026}
      SP_GATEWAY_URL: ${SP_GATEWAY_URL:-http://168.119.53.26:8484}
      SP_API_KEY: ${SP_API_KEY:-gameon-sp-api-key-2026}
      SP_WEBHOOK_SECRET: ${SP_WEBHOOK_SECRET:-gameon-hmac-webhook-secret-2026}
      SHORTCODE: "7198"
    ports:
      - "127.0.0.1:3602:3602"
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3602/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── Dedicated Admin Console ─────────────────────────────────────────────────
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.admin
    container_name: gameon-tele-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3603
      BACKEND_HOST: api
      BACKEND_PORT: 3602
    ports:
      - "127.0.0.1:3603:3603"
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3603/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── Public Player Web Client (3D Helix Jump) ────────────────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.web
    container_name: gameon-tele-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3600
      BACKEND_HOST: api
      BACKEND_PORT: 3602
    ports:
      - "127.0.0.1:3600:3600"
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3600/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  gameon_tele_pgdata:
