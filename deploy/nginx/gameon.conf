# ==============================================================================
# Host Nginx Configuration for GameOn Tele
# Target: GCP Compute Engine VM (innoserver-serv001: 34.41.116.217)
# Domain: innopulseplatform.com
# Upstreams:
#   - gameon_web: 127.0.0.1:3600 (3D Helix Jump Tournament Web Client)
#   - gameon_api: 127.0.0.1:3602 (Fastify Anti-Cheat API)
#   - gameon_admin: 127.0.0.1:3603 (Tournament Operations Console)
# ==============================================================================

upstream gameon_web {
    server 127.0.0.1:3600;
    keepalive 32;
}

upstream gameon_api {
    server 127.0.0.1:3602;
    keepalive 32;
}

upstream gameon_admin {
    server 127.0.0.1:3603;
    keepalive 16;
}

# 1. Player Client: gameon.innopulseplatform.com
server {
    listen 80;
    server_name gameon.innopulseplatform.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gameon.innopulseplatform.com;

    ssl_certificate /etc/letsencrypt/live/innopulseplatform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/innopulseplatform.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://gameon_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. API Subdomain: gameon-api.innopulseplatform.com
server {
    listen 80;
    server_name gameon-api.innopulseplatform.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gameon-api.innopulseplatform.com;

    ssl_certificate /etc/letsencrypt/live/innopulseplatform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/innopulseplatform.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://gameon_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Dedicated Admin Console: gameon-admin.innopulseplatform.com
server {
    listen 80;
    server_name gameon-admin.innopulseplatform.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gameon-admin.innopulseplatform.com;

